
name: Student Result Kubernetes CI CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sathwikaravapalli-max/student-result-ml

jobs:
  build-test-push:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML model
        run: python train_model.py

      - name: Run ML quality gate
        run: python quality_gate.py

      - name: Run ML pipeline tests
        run: python -m pytest test_ml_pipeline.py -v

      - name: Run prediction API tests
        run: python -m pytest test_app.py -v

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-ci-test \
            -e PORT=5000 \
            -p 5000:5000 \
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Verify application health
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is healthy."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Health check failed."
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Test metrics endpoint
        run: |
          curl --fail --silent http://localhost:5000/metrics \
            | grep -q 'student_api_http_requests_total'

      - name: Show Docker container logs
        if: always()
        run: docker logs student-result-ci-test || true

      - name: Remove Docker container
        if: always()
        run: docker rm -f student-result-ci-test || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SHA and latest images
        run: |
          docker push ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

          docker tag \
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            ${{ env.IMAGE_NAME }}:latest

          docker push ${{ env.IMAGE_NAME }}:latest

  deploy-kubernetes:
    name: Deploy to Minikube
    needs: build-test-push
    runs-on: self-hosted

    steps:
      - name: Verify Minikube connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl config current-context
          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes context verification failed."
          }

          kubectl get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Minikube connection failed."
          }

          kubectl get deployment student-result-api

      - name: Deploy new image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $image = "ghcr.io/sathwikaravapalli-max/student-result-ml:sha-${{ github.sha }}"

          kubectl set image deployment/student-result-api student-result-prediction=$image

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update Kubernetes image."
          }

          kubectl rollout status deployment/student-result-api --timeout=240s

          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes rollout failed."
          }

          kubectl wait --for=condition=Available deployment/student-result-api --timeout=120s

          if ($LASTEXITCODE -ne 0) {
            throw "Deployment is not available."
          }

      - name: Verify deployed application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl rollout status deployment/student-result-api --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Deployment rollout verification failed."
          }

          $portForward = Start-Process kubectl `
            -ArgumentList "port-forward service/student-result-api 18081:5000" `
            -PassThru -NoNewWindow

          try {
            $ready = $false

            for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 2

              if ($portForward.HasExited) {
                throw "Kubectl port-forward stopped unexpectedly."
              }

              try {
                $health = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:18081/health" `
                  -TimeoutSec 5

                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              }
              catch {
                Write-Host "Waiting for application health..."
              }
            }

            if (-not $ready) {
              throw "Application health verification failed."
            }

            Write-Host "Health check passed."

            $body = @{
              attendance = 90
              internal_marks = 85
              assignment_marks = 88
              previous_score = 80
            } | ConvertTo-Json

            $prediction = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18081/predict" `
              -Method Post `
              -ContentType "application/json" `
              -Body $body

            if (-not $prediction.prediction) {
              throw "Prediction verification failed."
            }

            Write-Host "Prediction: $($prediction.prediction)"

            # Read Prometheus metrics using curl.exe
            $metrics = & curl.exe --fail --silent --show-error `
              http://127.0.0.1:18081/metrics

            if ($LASTEXITCODE -ne 0) {
              throw "Metrics endpoint request failed."
            }

            # Convert response to text for reliable matching
            $metricsText = $metrics -join "`n"

            Write-Host "Metrics response:"
            Write-Host $metricsText

            if ($metricsText -notmatch "student_api_http_requests_total") {
              throw "Metrics verification failed. Expected metric was not found."
            }

            Write-Host "Metrics verification passed."
            Write-Host "All application checks passed."
          }
          finally {
            if ($portForward -and -not $portForward.HasExited) {
              Stop-Process -Id $portForward.Id -Force
            }
          }

      - name: Rollback if deployment fails
        if: failure()
        shell: powershell
        run: |
          Write-Host "Deployment failed. Attempting rollback."

          kubectl rollout undo deployment/student-result-api

          if ($LASTEXITCODE -ne 0) {
            throw "Automatic rollback command failed."
          }

          kubectl rollout status deployment/student-result-api --timeout=240s

          if ($LASTEXITCODE -ne 0) {
            throw "Rollback verification failed."
          }

          Write-Host "Rollback completed."

      - name: Show rollout history
        if: success()
        shell: powershell
        run: |
          kubectl rollout history deployment/student-result-api
          kubectl get deployment student-result-api
          kubectl get pods
          kubectl get services
