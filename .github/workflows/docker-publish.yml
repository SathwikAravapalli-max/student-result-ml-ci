
name: Build Test and Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/sathwikaravapalli-max/student-result-ml

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML model
        run: python train_model.py

      - name: Run ML quality gate
        run: python quality_gate.py

      - name: Run ML pipeline tests
        run: python -m pytest test_ml_pipeline.py -v

      - name: Run prediction API tests
        run: python -m pytest test_app.py -v

      - name: Build Docker image
        run: |
          docker build \
            -t student-result-ml:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-ml-container \
            -e PORT=8000 \
            -p 5000:8000 \
            student-result-ml:${{ github.sha }}

      - name: Wait for application health check
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is healthy."
              exit 0
            fi

            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Health check failed."
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs student-result-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f student-result-ml-container || true

      - name: Log in to GitHub Container Registry
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: success() && github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker tag \
            ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
