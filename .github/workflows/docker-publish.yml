
name: Build Test and Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t student-result-ml:ci .

      - name: Test Docker image
        run: |
          docker run -d \
            --name student-result-ml-test \
            -p 5000:5000 \
            student-result-ml:ci

          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Health check passed."
              break
            fi

            if [ "$i" -eq 15 ]; then
              echo "Health check failed."
              docker logs student-result-ml-test
              exit 1
            fi

            sleep 2
          done

          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker logs
        if: always()
        run: docker logs student-result-ml-test || true

      - name: Remove test container
        if: always()
        run: docker rm -f student-result-ml-test || true

      - name: Publish image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag student-result-ml:ci "$IMAGE:latest"
          docker tag student-result-ml:ci "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
